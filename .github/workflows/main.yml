name: PR Quality Checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Job names are required status checks in branch protection. Do not rename them.
jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: dibs-next/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefix dibs-next

      - name: Run ESLint
        run: npm run lint --prefix dibs-next

  typecheck:
    name: TS Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: dibs-next/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefix dibs-next

      - name: Run TypeScript Typecheck
        run: npm run typecheck --prefix dibs-next

  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: dibs-next/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefix dibs-next

      - name: Run Vitest Suite
        run: npm test --prefix dibs-next

  stubs:
    name: Stubs Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run Stubs Script
        run: npm run stubs
