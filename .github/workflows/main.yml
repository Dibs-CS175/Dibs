name: PR Quality Checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            dibs-next/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix dibs-next

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TS Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            dibs-next/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix dibs-next

      - name: Run TypeScript Typecheck
        run: npm run typecheck

  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            dibs-next/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix dibs-next

      - name: Run Vitest Suite
        run: npm test

  stubs:
    name: Stubs Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            dibs-next/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix dibs-next

      - name: Run Stubs Script
        run: npm run stubs
